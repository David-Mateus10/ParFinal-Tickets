<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard del Gestor - UsersAdmin">
    <title>Gestor - UsersAdmin</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/gestor.css">
</head>

<body>
    <header class="dashboard-header">
        <div class="container">
            <div class="header-content">
                <div class="header-left">
                    <div class="logo">🛠️</div>
                    <h1 class="header-title">UsersAdmin</h1>
                </div>
                <div class="header-right">
                    <div class="user-info">
                        <span class="user-icon">🧑‍💼</span>
                        <span id="userName" class="user-name">Usuario</span>
                        <span class="badge badge-primary">Gestor</span>
                    </div>
                    <button id="logoutBtn" class="btn btn-secondary btn-sm">Salir ⎋</button>
                </div>
            </div>
        </div>
    </header>

    <main class="dashboard-main">
        <div class="container">
            <div class="dashboard-grid">
                <aside class="dashboard-sidebar">
                    <nav class="sidebar-nav">
                        <button class="nav-item active" data-section="crear">🆕 Nuevo Ticket</button>
                        <button class="nav-item" data-section="mis-tickets">🗂️ Mis Tickets</button>
                    </nav>
                </aside>

                <div class="dashboard-content">
                    <!-------------------- Crear Ticket ------------------->
                    <section id="section-crear" class="content-section active">
                        <div class="section-header">
                            <h2>Registrar Ticket</h2>
                            <p class="text-secondary">Describe una situación o solicitud</p>
                        </div>

                        <div class="card">
                            <div class="card-body">
                                <form id="createTicketForm">
                                    <div class="form-group">
                                        <label for="titulo" class="form-label">Asunto</label>
                                        <input type="text" id="titulo" class="form-control"
                                            placeholder="Ej: Fallo en carga de usuarios" required>
                                    </div>

                                    <div class="form-group">
                                        <label for="descripcion" class="form-label">Detalle del Ticket</label>
                                        <textarea id="descripcion" class="form-control"
                                            placeholder="Describe claramente el problema o requerimiento..." rows="5"
                                            required></textarea>
                                    </div>

                                    <div id="createMessage" class="alert" style="display: none;"></div>

                                    <button type="submit" id="createBtn" class="btn btn-primary">Registrar 📨</button>
                                </form>
                            </div>
                        </div>
                    </section>

                    <!---------------- Mis Tickets ----------------->
                    <section id="section-mis-tickets" class="content-section">
                        <div class="section-header">
                            <h2>Tickets Creados</h2>
                            <p class="text-secondary">Historial de mis incidentes</p>
                        </div>

                        <div id="ticketsLoading" class="loading-container">
                            <div class="loading-spinner"></div>
                            <p>Cargando información…</p>
                        </div>

                        <div id="ticketsContainer" class="tickets-grid"></div>

                        <div id="noTickets" class="empty-state" style="display: none;">
                            <div class="empty-icon">📂</div>
                            <h3>No existen tickets</h3>
                            <p>Genera uno nuevo para comenzar</p>
                            <button class="btn btn-primary" data-section="crear">🆕 Crear Ticket</button>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <!---------------------- Modal de Detalles -----------> 
    <div id="ticketModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Ticket</h3>
                <button class="modal-close" id="closeModal">✖</button>
            </div>
            <div class="modal-body">
                <div id="ticketDetails"></div>

                <!----------------Sección de comentarios------------>
                <div class="comments-section">
                    <h4>Actividad</h4>
                    <div id="ticketHistory" class="history-list"></div>

                    <!----------Agregar comentario-------------->
                    <form id="addCommentForm" class="comment-form">
                        <div class="form-group">
                            <label for="comentario" class="form-label">Comentario</label>
                            <textarea id="comentario" class="form-control"
                                placeholder="Escribe un comentario..." rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm">Enviar 💬</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/gestor-dashboard.js"></script>
</body>

</html>
